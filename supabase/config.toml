# Supabase configuration for OrderKing
# Optimized for rootless Podman with custom non-conflicting ports
project_id = "orderking"

[api]
enabled = true
# Port to use for the API URL (Kong)
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
# Port to use for the local database URL (PostgreSQL)
port = 54422
# Port used by db diff command to initialize shadow database
shadow_port = 54420
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
# Port to use for Supabase Studio web dashboard
port = 54423
api_url = "http://localhost"

# Email testing server (Inbucket / Mailpit)
[local_smtp]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3005"
additional_redirect_urls = [
  "http://localhost:3005/**"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8084
deno_version = 2

[analytics]
# Disabled to prevent /var/run/docker.sock mount issues in rootless Podman
enabled = false
port = 54427
backend = "postgres"
